# Transit Pulse - local development stack
#
#   Redpanda (Kafka API)   localhost:19092   console: http://localhost:8085
#   SeaweedFS (S3 lake)    localhost:8333    browser: http://localhost:8888
#   Airflow                http://localhost:8080
#
# Start everything:   docker compose up -d --build
# Stop everything:    docker compose down          (add -v to wipe data)

name: transit-pulse

x-airflow-common: &airflow-common
  build: ./airflow
  image: transit-pulse-airflow:local   # one image shared by all Airflow services
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kuala_Lumpur
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Kuala_Lumpur
    AIRFLOW__WEBSERVER__WORKERS: "2"  # keep RAM low on laptops
    PYTHONPATH: /opt/airflow/ingestion
    S3_ENDPOINT_URL: http://lake:8333
    S3_ENDPOINT_HOST: lake:8333          # DuckDB wants host:port without scheme
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    DUCKDB_PATH: /opt/airflow/warehouse/transit_pulse.duckdb
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion:ro
    - ./warehouse:/opt/airflow/dbt
    - warehouse-data:/opt/airflow/warehouse
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    airflow-db:
      condition: service_healthy
    lake:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- streaming
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8085:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------- data lake
  # SeaweedFS: open-source, S3-compatible object store (stands in for S3/GCS locally).
  lake:
    # >= 4.x needed: 3.x reports directories as files to Spark's S3A connector.
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # file browser UI
    volumes:
      - lake-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------- ingestion
  producer:
    build: ./ingestion
    command: python -m transit.producer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy

  bronze-sink:
    build: ./ingestion
    command: python -m transit.bronze_sink
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      S3_ENDPOINT_URL: http://lake:8333
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      lake:
        condition: service_healthy

  # ---------------------------------------------------------------- stream processing
  spark-streaming:
    build: ./spark
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      S3_ENDPOINT_URL: http://lake:8333
    ports:
      - "4040:4040"   # Spark UI (Structured Streaming tab)
    volumes:
      - spark-checkpoints:/checkpoints
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      lake:
        condition: service_healthy

  # ---------------------------------------------------------------- orchestration
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  redpanda-data:
  lake-data:
  spark-checkpoints:
  warehouse-data:
  airflow-db-data:
  airflow-logs:
