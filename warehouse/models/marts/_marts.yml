version: 2

models:
  - name: fct_stop_arrivals
    description: >
      One row per vehicle visit to a scheduled stop, inferred from GPS pings.
      Timetable service gets delay_secs; frequency service gets
      running_time_deviation_secs (vs. its actual dispatch time).
    columns:
      - name: stop_visit_id
        data_tests: [unique, not_null]
      - name: schedule_type
        data_tests:
          - accepted_values: {values: [timetable, frequency]}
      - name: distance_m
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 150}
      - name: delay_secs
        description: Observed minus scheduled arrival (timetable service only).
        data_tests:
          - dbt_utils.accepted_range: {min_value: -1800, max_value: 1800}
          - not_null:
              config:
                where: "schedule_type = 'timetable'"

  - name: fct_vehicle_positions
    columns:
      - name: event_id
        data_tests: [unique, not_null]

  - name: dim_route
    description: Routes as an SCD Type 2 dimension built from daily GTFS snapshots.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [feed, route_id, valid_from]
    columns:
      - name: route_version_key
        data_tests: [unique, not_null]

  - name: dim_stop
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [feed, stop_id]

  - name: mart_route_on_time_daily
    columns:
      - name: pct_on_time
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [feed, service_date, route_id]
      - dbt_utils.expression_is_true:
          expression: "round(pct_on_time + pct_early + pct_late) = 100"

  - name: mart_network_delay_hourly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [feed, service_date, hour_local]

  - name: mart_dispatch_headways
    description: >
      Gaps between consecutive departures on the same Rapid KL route and direction,
      versus the published frequency.
    columns:
      - name: actual_headway_secs
        data_tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 14400, inclusive: true}
      - name: scheduled_headway_secs
        data_tests: [not_null]

  - name: mart_route_headway_daily
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [feed, service_date, route_id]
      - dbt_utils.expression_is_true:
          expression: "round(pct_evenly_spaced + pct_bunched + pct_gaps) = 100"

unit_tests:
  - name: headways_flag_bunching_and_gaps
    description: >
      Route U81 promises a bus every 20 min. B departs 5 min after A (bunched),
      C 20 min after B (on time), D 40 min after C (a gap). E runs in the other
      direction, so it starts its own sequence and produces no headway. Z left
      at 06:00, before data collection started (07:30), so the Z→A gap is an
      artifact of coverage and must be dropped.
    model: mart_dispatch_headways
    given:
      - input: ref('fct_vehicle_positions')
        format: csv
        rows: |
          feed,event_date_local,event_ts_local
          rapid-bus-kl,2026-11-13,2026-11-13 07:30:00
          rapid-bus-kl,2026-11-13,2026-11-13 09:10:00
      - input: ref('int_frequency_dispatches')
        format: csv
        rows: |
          feed,service_date,route_id,direction_id,trip_id,vehicle_id,dispatch_ts_local,scheduled_headway_secs
          rapid-bus-kl,2026-11-13,U81,0,t0,BUS_Z,2026-11-13 06:00:00,1200
          rapid-bus-kl,2026-11-13,U81,0,t0,BUS_A,2026-11-13 08:00:00,1200
          rapid-bus-kl,2026-11-13,U81,0,t0,BUS_B,2026-11-13 08:05:00,1200
          rapid-bus-kl,2026-11-13,U81,0,t0,BUS_C,2026-11-13 08:25:00,1200
          rapid-bus-kl,2026-11-13,U81,0,t0,BUS_D,2026-11-13 09:05:00,1200
          rapid-bus-kl,2026-11-13,U81,1,t1,BUS_E,2026-11-13 08:10:00,1200
    expect:
      format: csv
      rows: |
        vehicle_id,prev_vehicle_id,actual_headway_secs,headway_ratio,is_bunched,is_gap
        BUS_B,BUS_A,300,0.25,true,false
        BUS_C,BUS_B,1200,1.0,false,false
        BUS_D,BUS_C,2400,2.0,false,true
