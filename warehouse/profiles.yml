transit_pulse:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/warehouse/transit_pulse.duckdb') }}"
      threads: 2
      extensions: [httpfs, parquet]
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT_HOST', 'lake:8333') }}"
        s3_url_style: path
        s3_use_ssl: false
        s3_region: "{{ env_var('AWS_DEFAULT_REGION', 'ap-southeast-1') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
